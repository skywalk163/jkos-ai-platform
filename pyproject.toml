[project]
name = "dsh-ai-platform"
version = "0.1.0"
description = "极快AI操作系统 (JKOS, Jikuai AI OS) - 基于 FreeBSD + deepseek-harness 的企业级 AI 服务操作系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "mcp>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
prod = ["python-dotenv>=1.0.0", "uvicorn[standard]>=0.29.0"]
ocr = ["paddleocr>=2.7.0", "paddlepaddle>=2.6.0"]
asr = ["whisper>=20231117"]
video = ["opencv-python>=4.9.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "respx>=0.21.0"]
dev = ["ruff>=0.3.0", "mypy>=1.8.0", "pre-commit>=3.7.0"]

[project.scripts]
dsh-server = "dsh_core.cli:main"
dsh-plugin = "dsh_core.plugin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=dsh_core --cov-report=term-missing"

[tool.coverage.run]
source = ["dsh_core"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
